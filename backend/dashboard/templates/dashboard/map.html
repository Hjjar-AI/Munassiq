{% load dashboard_tags %}<div class="map-tools"><button type="button" data-map-zoom="1" aria-label="{% bi 'تكبير' 'Zoom in' %}">+</button><button type="button" data-map-zoom="-1" aria-label="{% bi 'تصغير' 'Zoom out' %}">−</button><button type="button" data-map-pan="-1,0">←</button><button type="button" data-map-pan="0,-1">↑</button><button type="button" data-map-pan="0,1">↓</button><button type="button" data-map-pan="1,0">→</button></div>
<div class="map" data-map data-tiles="{{ tile_url }}" data-picker="{% if map_picker %}true{% else %}false{% endif %}" role="region" aria-label="{% bi 'خريطة اختيار المكان' 'Place map' %}"></div>
<p data-map-status role="status"></p><p class="map-credit">© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a></p>
